# [fork:mc D-009] Builds the fork's server image from the `multicurrency`
# branch and publishes ghcr.io/<owner>/actual-server:multicurrency.
# Mirrors docker-nightly.yml, minus Docker Hub, Depot runners and the
# `release` environment, none of which exist in a fork. See fork/DEVIATIONS.md.
name: Fork Docker image

on:
  push:
    branches:
      - multicurrency
  workflow_dispatch:

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/actual-server

jobs:
  # Never publish an image that fails typecheck or tests: it runs against
  # real budget data.
  verify:
    if: github.repository != 'actualbudget/actual'
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'

      - name: Typecheck
        run: yarn typecheck

      - name: Core tests
        run: yarn workspace @actual-app/core run test

      - name: Web client tests
        run: yarn workspace @actual-app/web run test

  build:
    # Upstream has its own image pipeline
    if: github.repository != 'actualbudget/actual'
    needs: verify
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}
          # actual-server:multicurrency and actual-server:sha-<commit>
          tags: |
            type=ref,event=branch
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building outside the image lets one build serve both platforms
      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Build Web
        run: yarn build:server

      - name: Build image for testing
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          load: true
          file: packages/sync-server/docker/ubuntu.Dockerfile
          tags: actual-server-testing

      - name: Test that the docker image boots
        timeout-minutes: 1
        run: |
          docker run --detach --network=host --name actual-server actual-server-testing
          HEALTHCMD=$(yq -r '.services.actual_server.healthcheck.test[1]' packages/sync-server/docker-compose.yml)
          until docker exec actual-server sh -c "$HEALTHCMD"; do sleep 1; done

      - name: Dump container logs on failure
        if: failure()
        run: docker logs actual-server || true

      - name: Build and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
